<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>해성 해준을 위한 숫자 쓰기</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
<div id="app">

  <header id="app-header">
    <h1>해성 해준을 위한 숫자 쓰기 ✏️</h1>
    <div id="stage-dots" aria-label="단계"></div>
    <div id="progress-label">1 / 10</div>
    <button id="settings-btn" title="설정">⚙️</button>
    <button id="restart-btn" title="처음부터 다시">🔄</button>
  </header>

  <main id="main-area">
    <section id="left-panel">
      <p id="left-caption">몇 개일까요?</p>
      <div id="object-grid"></div>
    </section>

    <section id="right-panel">
      <div id="draw-area">
        <canvas id="guideCanvas"></canvas>
        <canvas id="inkCanvas"></canvas>
        <div id="result-overlay" class="hidden">
          <canvas id="resultCanvas"></canvas>
        </div>
        <div id="stage-clear-overlay" class="hidden">
          <div id="stage-clear-card">
            <div id="stage-clear-title"></div>
            <button id="stage-next-btn">다음 단계로 ▶</button>
          </div>
        </div>
        <div id="all-clear-overlay" class="hidden">
          <div id="all-clear-card">
            <div>🎉 모든 단계를 완료했어요! 🎉</div>
            <button id="restart-btn-2">처음부터 다시 하기</button>
          </div>
        </div>
      </div>
      <div id="hint-toast" class="hidden"></div>
    </section>
  </main>

  <footer id="bottom-bar">
    <div id="color-picker"></div>
    <div id="action-buttons">
      <button id="clear-btn">🧹 지우기</button>
      <button id="done-btn">✅ 완료!</button>
    </div>
    <div id="result-bar" class="hidden">
      <div id="praise-text">잘했어요! <span class="stars">🌟🌟🌟</span></div>
      <button id="next-btn">다음 ▶</button>
    </div>
  </footer>

</div>

<div id="rotate-prompt">
  <div id="rotate-icon">📱</div>
  <p>아이패드를 가로로 돌려서 사용해 주세요</p>
</div>

<div id="settings-overlay" class="hidden">
  <div id="settings-card">
    <div id="settings-header">
      <h2>설정</h2>
      <button id="settings-close-btn" aria-label="닫기">✕</button>
    </div>
    <p id="settings-credit">할아버지가 해성 해준을 위해 만들었어요 · 2026.9</p>
    <div id="settings-body">
      <h3>음성 녹음</h3>
      <p id="settings-hint-text">숫자와 칭찬 메시지를 할아버지·할머니 목소리로 직접 녹음해서 쓸 수 있어요. 녹음이 없으면 자동 음성이 대신 읽어줘요.</p>
      <div id="recording-list"></div>
    </div>
  </div>
</div>

<script src="app.js?v=23"></script>
</body>
</html>
