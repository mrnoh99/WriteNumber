<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>해성 해준을 위한 숫자 쓰기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.8em%22 font-size=%2280%22>✏️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
<div id="app">

  <header id="app-header">
    <h1>해성 해준을 위한 숫자 쓰기 ✏️</h1>
    <div id="stage-dots" aria-label="단계"></div>
    <div id="progress-label">1 / 10</div>
    <button id="restart-btn" title="처음부터 다시">🔄</button>
  </header>

  <main id="main-area">
    <section id="left-panel">
      <p id="left-caption">몇 개일까요?</p>
      <div id="object-grid"></div>
    </section>

    <section id="right-panel">
      <div id="draw-area">
        <canvas id="guideCanvas"></canvas>
        <canvas id="inkCanvas"></canvas>
        <div id="result-overlay" class="hidden">
          <canvas id="resultCanvas"></canvas>
        </div>
        <div id="stage-clear-overlay" class="hidden">
          <div id="stage-clear-card">
            <div id="stage-clear-title"></div>
            <button id="stage-next-btn">다음 단계로 ▶</button>
          </div>
        </div>
        <div id="all-clear-overlay" class="hidden">
          <div id="all-clear-card">
            <div>🎉 모든 단계를 완료했어요! 🎉</div>
            <button id="restart-btn-2">처음부터 다시 하기</button>
          </div>
        </div>
      </div>
      <div id="hint-toast" class="hidden"></div>
    </section>
  </main>

  <footer id="bottom-bar">
    <div id="color-picker"></div>
    <div id="action-buttons">
      <button id="clear-btn">🧹 지우기</button>
      <button id="done-btn">✅ 완료!</button>
    </div>
    <div id="result-bar" class="hidden">
      <div id="praise-text">잘했어요! <span class="stars">🌟🌟🌟</span></div>
      <button id="next-btn">다음 ▶</button>
    </div>
  </footer>

</div>
<script src="app.js?v=13"></script>
</body>
</html>
